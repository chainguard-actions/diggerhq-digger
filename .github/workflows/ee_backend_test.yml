---
name: EE Backend Go Tests

"on":
  push:
    branches: ['develop']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Download Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.4
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Test that the docker image still builds successfully
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1
      
      - name: Build Docker image with Depot
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: kcld4zgwzx
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          file: ./Dockerfile_backend_ee
          push: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Deps
        run: go get -v ./...
        working-directory: ee/backend

      - name: Build
        run: go build
        working-directory: ee/backend

      - name: Test
        run: go test -v ./...
        env:
          GITHUB_PAT_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        working-directory: ee/backend
