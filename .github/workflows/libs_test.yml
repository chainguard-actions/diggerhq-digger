---
name: Libs tests

"on":
  push:
    branches: ['develop']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Opentofu
        uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.8.5
          
      - name: Setup terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
          terraform_version: "1.5.5"

      - name: Download Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.0
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deps
        run: |
          pwd
          go get -v ./...
        working-directory: libs

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite service
        run: azurite --silent &

      - name: Determine if PR is from external contributor
        id: pr_check
        env:
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO_FULL_NAME" = "$REPOSITORY" ]; then
          echo "is_external=false" >> $GITHUB_OUTPUT
          else
          echo "is_external=true" >> $GITHUB_OUTPUT
          fi

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.8.5

      - name: Test
        run: |
          if [ "$IS_EXTERNAL" = "true" ]; then
            export IS_EXTERNAL_PR="true"
            go test ./... 
          else
            go test ./...
          fi
        env:
          DIGGER_LICENSE_KEY: ${{ secrets.TEST_DIGGER_LICENSE_KEY}}
          IS_EXTERNAL: ${{ steps.pr_check.outputs.is_external }}
        working-directory: libs
