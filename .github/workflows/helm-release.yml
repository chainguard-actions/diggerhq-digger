name: Release Helm Charts

on:
  push:
    branches:
      - develop
    paths:
      - "self-hosting/kubernetes/helm-charts/**"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  packages: write

jobs:
  # First, release individual charts
  release-charts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - digger-backend
          - taco-orchestrator
          - taco-statesman
          - taco-token-service
          - taco-drift
          - taco-ui
          - taco-sidecar
          - opentaco-platform-reference
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Package and push ${{ matrix.chart }}
        env:
          CHART_NAME: ${{ matrix.chart }}
        run: |
          cd "self-hosting/kubernetes/helm-charts/${CHART_NAME}"
          if grep -q "^dependencies:" Chart.yaml; then
            helm dependency build
          fi
          helm package .
          helm push "${CHART_NAME}"-*.tgz oci://ghcr.io/diggerhq/helm-charts

  # Then release umbrella chart after dependencies are available
  release-umbrella:
    needs: release-charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build dependencies for opentaco
        run: |
          cd self-hosting/kubernetes/helm-charts/opentaco
          helm dependency build

      - name: Package and push opentaco
        run: |
          cd self-hosting/kubernetes/helm-charts/opentaco
          helm package .
          helm push opentaco-*.tgz oci://ghcr.io/diggerhq/helm-charts
