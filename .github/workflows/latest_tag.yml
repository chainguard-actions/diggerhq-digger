---
name: Update latest tag for every new latest release

"on":
  release:
    types:
      - 'released'

permissions:
  contents: write

jobs:
  update_latest_tag:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check if the latest release
        id: check_latest_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          latest_release=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${REPOSITORY}/releases/latest" | jq -r '.tag_name')
          echo "Latest release: $latest_release"
          echo "Current release: $CURRENT_REF"
          if [[ "refs/tags/$latest_release" == "$CURRENT_REF" ]]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Update latest tag
        if: steps.check_latest_release.outputs.is_latest == 'true'
        uses: EndBug/latest-tag@8fcae8848c1e23fd8212258f69a9619bc62cad67 # latest
        with:
          ref: latest
          description: Latest tag
          force-branch: false

      - name: Upload release asset
        if: steps.check_latest_release.outputs.is_latest == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}
