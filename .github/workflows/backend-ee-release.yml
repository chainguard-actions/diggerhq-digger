name: Backend EE Docker Release

on:
  push:
    tags:
      - 'backend-ee/v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/digger-backend-ee

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"      # e.g. backend-ee/v1.2.3
          VERSION="${TAG##*/}"          # v1.2.3
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=ref,event=tag
            type=raw,value=latest
      
      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1
      - uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: kcld4zgwzx
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          file: ./Dockerfile_backend_ee
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

            
  create-release:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"      # e.g. backend-ee/v1.2.3
          VERSION="${TAG##*/}"          # v1.2.3
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Digger Backend EE ${{ steps.meta.outputs.version }}
          body: |
            ## Digger Backend (Enterprise Edition) ${{ steps.meta.outputs.version }}
            
            Terraform orchestration service with advanced features and multi-VCS support.
            
            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```
            
          draft: false
          prerelease: false

