---
name: release dgctl

"on":
  release:
    branches:
      - 'go'
    types:
      - 'released'

permissions:
  contents: write

jobs:
  binary:
    if: "!startsWith(github.event.release.tag_name, 'taco/')"
    strategy:
      matrix:
        arch: [arm, arm64, amd64, "386"]
        os: [linux, darwin, freebsd, windows]
        exclude:
          - os: darwin
            arch: arm
          - os: darwin
            arch: "386"

    runs-on: ubuntu-latest

    steps:
      - name: Download Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.24.0
        id: go

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        env:
          MATRIX_OS: ${{matrix.os}}
          MATRIX_ARCH: ${{matrix.arch}}
        run: |
          env GOOS="$MATRIX_OS" GOARCH="$MATRIX_ARCH" CGO_ENABLED=0 go build -o dgctl_bin ./dgctl/main.go

      - name: Publish linux-x64 exec to github
        id: upload-release-asset-linux-x64
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: 'dgctl_bin'
          asset_name: dgctl-${{matrix.os}}-${{matrix.arch}}
          asset_content_type: application/octet-stream
