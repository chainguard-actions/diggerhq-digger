name: Test binary mode determination
on:
  workflow_dispatch:
jobs:
  test-prebuilt-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When digger-version is set to a valid vX.Y.Z, binary-mode should be 'prebuilt'
      # The action will try to download the binary; a nonexistent version fails at download
      # (not at version validation), confirming prebuilt mode was selected
      - name: Run action with valid version format (prebuilt mode selected)
        id: prebuilt-attempt
        uses: .
        continue-on-error: true
        with:
          digger-version: "v0.0.1"
          configure-checkout: "false"

      - name: Assert action attempted prebuilt mode (failed at download, not validation)
        env:
          OUTCOME: ${{ steps.prebuilt-attempt.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (binary download fails for nonexistent version)
          # but NOT at the version validation step (which would also be failure)
          # The key is that v0.0.1 passes the regex ^v[0-9]+\.[0-9]+\.[0-9]+$
          # so the failure is at download time, confirming prebuilt mode was selected
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (download failure), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action entered prebuilt mode (failed at download as expected for nonexistent version)"

  test-build-mode-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When digger-version is empty and action_ref is not a tag (workflow_dispatch),
      # binary-mode should be 'build'. The action will try to build from source.
      # We verify the version validation passes (empty string is allowed).
      - name: Verify empty digger-version passes validation
        run: |
          INPUT_DIGGER_VERSION=""
          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "FAIL: empty version should pass validation"
            exit 1
          fi
          echo "PASS: empty version passes validation"

      - name: Verify valid version format passes validation
        run: |
          INPUT_DIGGER_VERSION="v1.2.3"
          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "FAIL: v1.2.3 should pass validation"
            exit 1
          fi
          echo "PASS: v1.2.3 passes validation"

      - name: Verify invalid version format fails validation
        run: |
          INPUT_DIGGER_VERSION="not-a-version"
          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "PASS: invalid version correctly fails validation"
          else
            echo "FAIL: invalid version should fail validation"
            exit 1
          fi
