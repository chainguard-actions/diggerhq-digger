name: Test upload plan destination inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          upload-plan-destination: "aws"
          upload-plan-destination-s3-bucket: "my-plan-bucket"
          upload-plan-destination-s3-encryption-enabled: "true"
          upload-plan-destination-s3-encryption-type: "KMS"
          upload-plan-destination-s3-encryption-kms-key-id: "arn:aws:kms:us-east-1:123456789012:key/test-key-id"
          upload-plan-destination-azure-container: "my-azure-container"
          upload-plan-destination-azure-storage-account: "myazurestorageaccount"
          upload-plan-destination-gcp-bucket: "my-gcp-plan-bucket"
          no-backend: "true"
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with upload plan destination inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
