name: Test configure-checkout false skips checkout step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Verify that configure-checkout=false is accepted by the action.
      # We use an invalid version so the action fails early at version validation,
      # before any checkout or network operations are attempted.
      - name: Run action with configure-checkout false and invalid version
        id: action
        uses: .
        with:
          configure-checkout: "false"
          digger-version: "not-a-valid-version"
        continue-on-error: true

      - name: Assert action failed at version validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid digger-version even with configure-checkout=false"

      # Verify the configure-checkout logic in bash:
      # When configure-checkout=false, the checkout steps should be skipped
      - name: Verify configure-checkout=false skips checkout logic
        run: |
          CONFIGURE_CHECKOUT="false"
          EVENT_NAME="workflow_dispatch"

          # Simulate the action's checkout condition
          if [[ "$EVENT_NAME" == "issue_comment" && "$CONFIGURE_CHECKOUT" == "true" ]]; then
            echo "FAIL: should not checkout for issue_comment when configure-checkout=false"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "issue_comment" && "$CONFIGURE_CHECKOUT" == "true" ]]; then
            echo "FAIL: should not checkout when configure-checkout=false"
            exit 1
          fi
          echo "PASS: configure-checkout=false correctly skips checkout"
