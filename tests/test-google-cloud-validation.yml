name: Test Google Cloud input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When setup-google-cloud=true but neither google-auth-credentials nor
      # google-workload-identity-provider is provided, the action should fail
      # at the "Validate Input Configuration for Google" step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "true"
          configure-checkout: "false"
          # Intentionally omitting google-auth-credentials and
          # google-workload-identity-provider to trigger validation failure

      - name: Assert action failed due to missing Google credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Google Cloud credentials are missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected missing Google Cloud credentials"
