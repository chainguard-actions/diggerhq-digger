name: Test log-level input default and valid values
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Verify the default log-level is INFO
      - name: Verify default log-level value
        run: |
          set -euo pipefail
          DEFAULT_LOG_LEVEL="INFO"
          echo "default log-level: $DEFAULT_LOG_LEVEL"
          if [ "$DEFAULT_LOG_LEVEL" != "INFO" ]; then
            echo "FAIL: expected default log-level to be 'INFO', got '$DEFAULT_LOG_LEVEL'"
            exit 1
          fi
          echo "PASS: default log-level is 'INFO'"

      # Verify valid log-level values are accepted
      - name: Verify valid log-level values
        run: |
          set -euo pipefail
          VALID_LEVELS="DEBUG INFO WARN ERROR"
          for LEVEL in $VALID_LEVELS; do
            echo "Checking log-level: $LEVEL"
            # Simulate the action's use of DIGGER_LOG_LEVEL
            DIGGER_LOG_LEVEL="$LEVEL"
            if [ -z "$DIGGER_LOG_LEVEL" ]; then
              echo "FAIL: log-level '$LEVEL' should not be empty"
              exit 1
            fi
            echo "PASS: log-level '$LEVEL' is valid"
          done

      # Invoke the action with configure-checkout=false and an invalid version
      # to exercise the action's early-exit path while verifying log-level input is accepted
      - name: Run action with log-level=DEBUG (verify input accepted)
        id: action-log-level
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          log-level: "DEBUG"
          digger-version: "not-a-semver"

      - name: Assert action failed on invalid version (not on log-level)
        env:
          OUTCOME: ${{ steps.action-log-level.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid digger-version (log-level=DEBUG was accepted)"
