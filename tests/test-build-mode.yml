name: Test build-from-source mode (default under act)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run digger without specifying version (triggers build mode under act)
        id: action
        uses: .
        with:
          configure-checkout: "false"
          no-backend: "true"
        continue-on-error: true

      - name: Assert action ran (build mode attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, github.action_ref is not a v* tag and digger-version is empty,
          # so the action enters 'build' mode (builds from source).
          # The build may succeed or fail depending on Go source availability,
          # but the action should not fail at the version validation step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in build mode (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
