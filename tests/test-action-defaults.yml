name: Test action with default inputs (binary mode detection via action)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with configure-checkout=false to avoid re-checkout,
      # and no-backend=true. The action will fail at the build/run step since
      # there's no Go source in the test environment, but we can verify
      # the determine-binary-mode step ran correctly.
      # Under act, github.action_ref is not a v* tag, so binary-mode = "build".
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          no-backend: "true"
          log-level: "DEBUG"

      - name: Assert action ran (binary-mode step executed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the build step (no Go source in test env)
          # OR succeed if the environment happens to have Go and the digger source.
          # Either way, the determine-binary-mode step should have run.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test env without Go source)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
