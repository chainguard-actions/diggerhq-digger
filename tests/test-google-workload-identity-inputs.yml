name: Test Google Workload Identity inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "false"
          google-workload-identity-provider: "projects/123/locations/global/workloadIdentityPools/my-pool/providers/my-provider"
          google-workload-identity-provider-audience: "https://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/my-pool/providers/my-provider"
          google-service-account: "my-service-account@my-project.iam.gserviceaccount.com"
          digger-version: "v0.6.147"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (continue-on-error allows download failures)"
          echo "PASS: google-workload-identity-provider, google-workload-identity-provider-audience, google-service-account inputs were accepted"
