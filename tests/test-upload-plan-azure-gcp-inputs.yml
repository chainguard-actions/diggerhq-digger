name: Test upload plan Azure and GCP inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload-plan-destination: "gcp"
          upload-plan-destination-azure-container: "terraform-plans-container"
          upload-plan-destination-azure-storage-account: "mystorageaccount"
          upload-plan-destination-gcp-bucket: "my-gcp-plans-bucket"
          digger-version: "v0.6.147"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (continue-on-error allows download failures)"
          echo "PASS: upload-plan-destination-azure-container, upload-plan-destination-azure-storage-account, upload-plan-destination-gcp-bucket inputs were accepted"
