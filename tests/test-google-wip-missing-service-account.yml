name: Test google workload identity provider without service account fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "true"
          configure-checkout: "false"
          google-workload-identity-provider: projects/123/locations/global/workloadIdentityPools/pool/providers/provider
          google-workload-identity-provider-audience: https://example.com/audience
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when google-service-account is missing with workload identity provider"
            exit 1
          fi
          echo "PASS"
