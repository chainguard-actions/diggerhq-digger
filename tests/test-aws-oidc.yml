name: Test AWS OIDC inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run digger with AWS OIDC inputs (setup-aws disabled)
        id: action
        uses: .
        with:
          configure-checkout: "false"
          no-backend: "true"
          setup-aws: "false"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/ExampleRole"
          aws-web-identity-token-file: "/tmp/web-identity-token"
          aws-region: "us-east-1"
        continue-on-error: true

      - name: Assert action ran with AWS OIDC inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # setup-aws is false so AWS OIDC is not configured,
          # but the inputs are passed through. The action may succeed or fail
          # depending on digger.yml availability, but should not fail at input validation.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with AWS OIDC inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
