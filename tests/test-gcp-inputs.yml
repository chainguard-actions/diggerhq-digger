name: Test GCP inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "false"
          google-auth-credentials: "fake-credentials-json"
          google-workload-identity-provider: "projects/123/locations/global/workloadIdentityPools/my-pool/providers/my-provider"
          google-workload-identity-provider-audience: "https://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/my-pool/providers/my-provider"
          google-service-account: "my-sa@my-project.iam.gserviceaccount.com"
          google-lock-bucket: "my-lock-bucket"
          upload-plan-destination: "gcp"
          upload-plan-destination-gcp-bucket: "my-gcp-plan-bucket"
          digger-version: "v0.6.151"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action ran (expected to fail gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with GCP inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
