name: Test Google Cloud inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "false"
          google-auth-credentials: "fake-credentials-json"
          google-workload-identity-provider: "projects/123/locations/global/workloadIdentityPools/pool/providers/provider"
          google-workload-identity-provider-audience: "https://iam.googleapis.com/fake-audience"
          google-service-account: "fake-sa@fake-project.iam.gserviceaccount.com"
          google-lock-bucket: "fake-lock-bucket"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action ran (GCP inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with GCP inputs present (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
