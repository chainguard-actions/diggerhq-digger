name: Test local-dev-mode rejects invalid path characters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with local-dev-mode and path containing invalid characters
        id: action-invalid-chars
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "/tmp/bad path; rm -rf"
          configure-checkout: "false"

      - name: Assert action failed due to invalid path characters
        env:
          OUTCOME: ${{ steps.action-invalid-chars.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid path containing special characters"
            exit 1
          fi
          echo "PASS: action correctly rejected path with invalid characters"

      - name: Run action with local-dev-mode and relative path (not absolute)
        id: action-relative-path
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "./relative/path"
          configure-checkout: "false"

      - name: Assert action failed due to relative path
        env:
          OUTCOME: ${{ steps.action-relative-path.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with relative path (not absolute)"
            exit 1
          fi
          echo "PASS: action correctly rejected relative path"
