name: Test local-dev-mode fails when binary does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid directory without a digger binary
        run: |
          mkdir -p /tmp/digger-test-dir
          # Intentionally do NOT create a digger binary here

      - name: Run action with local-dev-mode pointing to dir without binary
        id: action
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "/tmp/digger-test-dir"
          configure-checkout: "false"

      - name: Assert action failed because digger binary is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when digger binary does not exist in the specified directory"
            exit 1
          fi
          echo "PASS: action correctly failed when digger binary was not found"
