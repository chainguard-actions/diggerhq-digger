name: Test invalid digger-version format variations
on:
  workflow_dispatch:
jobs:
  test-missing-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with version missing patch number (should fail)
        id: action
        uses: .
        with:
          digger-version: "v1.2"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed due to invalid version format
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with version 'v1.2' (missing patch), but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly rejected version 'v1.2' (missing patch number)"

  test-no-v-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with version missing v prefix (should fail)
        id: action
        uses: .
        with:
          digger-version: "1.2.3"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed due to missing v prefix
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with version '1.2.3' (no v prefix), but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly rejected version '1.2.3' (missing v prefix)"
