name: Test invalid digger-version format (partial semver) is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid digger-version (partial semver vX.Y)
        id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "v1.2"
          configure-checkout: "false"

      - name: Assert action failed due to invalid version format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version 'v1.2' (partial semver)"
            exit 1
          fi
          echo "PASS: action correctly rejected partial semver digger-version format"
