name: Test valid digger-version format passes validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Invoke action with valid semver digger-version
        id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "v0.6.151"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action ran (valid version accepted, binary download may fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (e.g. binary download fails
          # in the harness environment). What must NOT happen is an early exit due to
          # invalid version format — that would produce a different error message.
          # Both 'success' and 'failure' are acceptable outcomes here; 'skipped' is not.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with valid version format (outcome=$OUTCOME)"
