name: Test valid digger-version format passes validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # A version like "1.2.3-invalid" (no leading v) should fail validation
      - name: Run action with version missing leading v (should fail)
        id: no-v-prefix
        uses: .
        continue-on-error: true
        with:
          digger-version: "1.2.3"
          configure-checkout: "false"

      - name: Assert action failed due to missing v prefix
        env:
          OUTCOME: ${{ steps.no-v-prefix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with version missing v prefix, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected version without v prefix"

      # A version with extra suffix should also fail
      - name: Run action with version with extra suffix (should fail)
        id: extra-suffix
        uses: .
        continue-on-error: true
        with:
          digger-version: "v1.2.3-beta"
          configure-checkout: "false"

      - name: Assert action failed due to extra suffix
        env:
          OUTCOME: ${{ steps.extra-suffix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with version with extra suffix, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected version with extra suffix"
