name: Test local-dev-mode succeeds with a valid executable binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake digger binary
        run: |
          mkdir -p /tmp/digger-local-bin
          cat > /tmp/digger-local-bin/digger << 'EOF'
          #!/bin/sh
          echo "Fake digger CLI running in local dev mode"
          exit 0
          EOF
          chmod +x /tmp/digger-local-bin/digger

      - name: Run action with local-dev-mode and valid binary
        id: action
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "/tmp/digger-local-bin"
          configure-checkout: "false"

      - name: Assert action succeeded with valid local binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with a valid local digger binary"
            exit 1
          fi
          echo "PASS: action succeeded with valid local digger binary"
