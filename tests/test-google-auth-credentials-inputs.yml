name: Test Google auth credentials inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "false"
          google-auth-credentials: '{"type":"service_account","project_id":"test"}'
          google-lock-bucket: "my-lock-bucket"
          digger-version: "v0.6.147"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (continue-on-error allows download failures)"
          echo "PASS: google-auth-credentials and google-lock-bucket inputs were accepted"
