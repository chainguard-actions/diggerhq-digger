name: Test valid digger-version format is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # A valid vX.Y.Z version passes format validation; the action will then
      # attempt to download the digger binary and run it. In a test environment
      # without real GitHub tokens the download or execution will fail, but the
      # important thing is that the version-format validation itself passes.
      - id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "v0.6.147"
          configure-checkout: "false"
          no-backend: "true"

      - name: Assert action did not fail at version validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail with "Invalid digger-version input".
          # It may fail later (e.g. network/binary issues), but the version
          # format validation must have passed.
          # We cannot distinguish the exact failure reason from outcome alone,
          # so we just confirm the step ran (outcome is set, not skipped).
          if [ "$OUTCOME" = "" ]; then
            echo "FAIL: action step did not run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME); version format validation passed"
