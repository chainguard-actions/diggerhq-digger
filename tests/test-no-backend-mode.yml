name: Test no-backend and mode inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Verify default values for no-backend and mode inputs
      - name: Verify default no-backend value is false
        run: |
          set -euo pipefail
          DEFAULT_NO_BACKEND="false"
          echo "default no-backend: $DEFAULT_NO_BACKEND"
          if [ "$DEFAULT_NO_BACKEND" != "false" ]; then
            echo "FAIL: expected default no-backend to be 'false', got '$DEFAULT_NO_BACKEND'"
            exit 1
          fi
          echo "PASS: default no-backend is 'false'"

      - name: Verify default mode value is empty
        run: |
          set -euo pipefail
          DEFAULT_MODE=""
          echo "default mode: '$DEFAULT_MODE'"
          if [ "$DEFAULT_MODE" != "" ]; then
            echo "FAIL: expected default mode to be empty string, got '$DEFAULT_MODE'"
            exit 1
          fi
          echo "PASS: default mode is empty string"

      - name: Verify default command value is empty
        run: |
          set -euo pipefail
          DEFAULT_COMMAND=""
          echo "default command: '$DEFAULT_COMMAND'"
          if [ "$DEFAULT_COMMAND" != "" ]; then
            echo "FAIL: expected default command to be empty string, got '$DEFAULT_COMMAND'"
            exit 1
          fi
          echo "PASS: default command is empty string"

      # Invoke the action with no-backend=true and an invalid version to exercise
      # the early-exit path while verifying no-backend input is accepted
      - name: Run action with no-backend=true (verify input accepted)
        id: action-no-backend
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          no-backend: "true"
          mode: "drift-detection"
          digger-version: "not-a-semver"

      - name: Assert action failed on invalid version (not on no-backend)
        env:
          OUTCOME: ${{ steps.action-no-backend.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid digger-version (no-backend and mode inputs were accepted)"
