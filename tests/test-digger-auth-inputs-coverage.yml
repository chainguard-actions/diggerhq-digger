name: Test Digger auth inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          digger-filename: "digger.yml"
          digger-organisation: "my-org"
          digger-private-key: "fake-private-key-value"
          digger-token: "fake-digger-token"
          configure-checkout: "false"
          digger-version: "v0.6.146"
          no-backend: "true"
      - name: Assert inputs were accepted
        run: |
          echo "Action step completed (continue-on-error). Inputs were passed successfully."
          echo "PASS: Digger auth inputs were accepted by the action"
