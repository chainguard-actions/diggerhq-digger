name: Test upload plan destination AWS inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run digger with AWS S3 upload plan destination inputs
        id: action
        uses: .
        with:
          configure-checkout: "false"
          no-backend: "true"
          upload-plan-destination: "aws"
          upload-plan-destination-s3-bucket: "my-plan-bucket"
          upload-plan-destination-s3-encryption-enabled: "true"
          upload-plan-destination-s3-encryption-type: "KMS"
          upload-plan-destination-s3-encryption-kms-key-id: "arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012"
        continue-on-error: true

      - name: Assert action ran with AWS S3 upload plan inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The upload plan destination inputs are passed through. The action may succeed
          # or fail depending on digger.yml availability and S3 connectivity,
          # but should not fail at input validation.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with AWS S3 upload plan inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
