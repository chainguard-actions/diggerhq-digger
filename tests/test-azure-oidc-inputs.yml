name: Test Azure and AWS OIDC inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-aws: "false"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/test-role"
          aws-web-identity-token-file: "/tmp/web-identity-token"
          setup-azure: "false"
          azure-client-id: "fake-azure-client-id"
          azure-tenant-id: "fake-azure-tenant-id"
          azure-subscription-id: "fake-azure-subscription-id"
          upload-plan-destination: "azure"
          upload-plan-destination-azure-container: "my-container"
          upload-plan-destination-azure-storage-account: "mystorageaccount"
          digger-version: "v0.6.151"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action ran (expected to fail gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with Azure/AWS OIDC inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
