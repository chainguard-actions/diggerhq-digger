name: Test AWS inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-aws: "false"
          aws-access-key-id: "AKIAIOSFODNN7EXAMPLE"
          aws-secret-access-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/example-role"
          aws-web-identity-token-file: "/tmp/web-identity-token"
          aws-region: "us-east-1"
          digger-token: "test-token"
          digger-organisation: "test-org"
          digger-private-key: "test-private-key"
          digger-filename: "digger.yml"
          upload-plan-destination: "aws"
          upload-plan-destination-s3-bucket: "my-plan-bucket"
          upload-plan-destination-s3-encryption-kms-key-id: "arn:aws:kms:us-east-1:123456789012:key/example"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert binary-mode determination ran
        run: |
          echo "Action completed (possibly with expected error since no real digger backend)"
          echo "PASS: all AWS inputs were accepted by the action"
