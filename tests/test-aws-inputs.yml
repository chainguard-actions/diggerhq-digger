name: Test AWS and digger credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-aws: "false"
          aws-access-key-id: "AKIAIOSFODNN7EXAMPLE"
          aws-secret-access-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/test-role"
          aws-web-identity-token-file: "/tmp/web-identity-token"
          digger-token: "test-digger-token"
          digger-organisation: "test-org"
          digger-private-key: "test-private-key"
          digger-filename: "digger.yml"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action accepted inputs
        run: |
          echo "Action completed (possibly with expected error since no digger binary)"
          echo "PASS: inputs were accepted by the action"
