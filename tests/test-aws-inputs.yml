name: Test AWS credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          no-backend: "true"
          setup-aws: "false"
          aws-access-key-id: "AKIAIOSFODNN7EXAMPLE"
          aws-secret-access-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/test-role"
          aws-web-identity-token-file: "/tmp/web-identity-token"
          upload-plan-destination: "aws"
          upload-plan-destination-s3-bucket: "my-test-bucket"
          upload-plan-destination-s3-encryption-kms-key-id: "arn:aws:kms:us-east-1:123456789012:key/test-key"
          digger-filename: "digger.yml"
          digger-organisation: "test-org"
          digger-private-key: "test-private-key"
          digger-token: "test-token"
      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with AWS inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
