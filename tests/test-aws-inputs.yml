name: Test AWS inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-aws: "false"
          aws-access-key-id: "fake-key-id"
          aws-secret-access-key: "fake-secret-key"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/fake-role"
          aws-web-identity-token-file: "/tmp/fake-token-file"
          digger-filename: "digger.yml"
          digger-organisation: "my-org"
          digger-private-key: "fake-private-key"
          digger-token: "fake-digger-token"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with AWS inputs present (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
