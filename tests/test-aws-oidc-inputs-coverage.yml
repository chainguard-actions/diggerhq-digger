name: Test AWS OIDC inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-aws: "false"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/fake-role"
          aws-web-identity-token-file: "/tmp/fake-token-file"
          aws-region: "us-east-1"
          upload-plan-destination-azure-container: "my-plan-container"
          upload-plan-destination-azure-storage-account: "myplanstorageaccount"
          configure-checkout: "false"
          digger-version: "v0.6.146"
          no-backend: "true"
      - name: Assert inputs were accepted
        run: |
          echo "Action step completed (continue-on-error). Inputs were passed successfully."
          echo "PASS: AWS OIDC and Azure upload inputs were accepted by the action"
