name: Test Google Cloud credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          setup-google-cloud: "false"
          google-auth-credentials: "eyJmYWtlIjoidGVzdCJ9"
          google-workload-identity-provider: "projects/123/locations/global/workloadIdentityPools/test/providers/test"
          google-workload-identity-provider-audience: "https://iam.googleapis.com/test"
          google-service-account: "test@test-project.iam.gserviceaccount.com"
          google-lock-bucket: "my-lock-bucket"
          no-backend: "true"
      - name: Assert action ran (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with Google Cloud credential inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
