name: Test Google Cloud credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "false"
          google-auth-credentials: "test-credentials-json"
          google-workload-identity-provider: "projects/123/locations/global/workloadIdentityPools/pool/providers/provider"
          google-workload-identity-provider-audience: "https://iam.googleapis.com/projects/123"
          google-service-account: "test-sa@test-project.iam.gserviceaccount.com"
          google-lock-bucket: "test-lock-bucket"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action accepted inputs
        run: |
          echo "Action completed (possibly with expected error since no digger binary)"
          echo "PASS: Google Cloud inputs were accepted by the action"
