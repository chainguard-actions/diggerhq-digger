name: Test local-dev-mode sets binary-mode to local
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Call the action under test (continue-on-error since local-dev-mode requires a real binary)
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          digger-version: "v0.6.146"

      - name: Determine binary mode (local, build, or pre-built)
        id: determine-binary-mode
        env:
          LOCAL_DEV_MODE: "true"
          INPUT_DIGGER_VERSION: ""
          ACTION_REF: "main"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi
          echo "binary-mode=${BINARY_MODE}" >> ${GITHUB_OUTPUT}
        shell: bash

      - name: Assert binary-mode is local
        env:
          ACTUAL: ${{ steps.determine-binary-mode.outputs.binary-mode }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "local" ]; then
            echo "FAIL: expected 'local' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
