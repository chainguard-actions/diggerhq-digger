name: Test local-dev-mode rejects relative path in local-dev-cli-path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in local-dev-mode with relative path (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "./relative/path/digger"
          configure-checkout: "false"

      - name: Assert action failed due to relative path rejection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action validates that local-dev-cli-path must be an absolute path
          # A relative path like "./relative/path/digger" should be rejected
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with relative local-dev-cli-path, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected relative path in local-dev-cli-path"
