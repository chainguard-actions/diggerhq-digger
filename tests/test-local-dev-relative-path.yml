name: Test local dev mode rejects relative cli path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake digger binary in a relative dir
        run: |
          rm -f /tmp/relative-digger-ran
          mkdir -p fake-digger-rel
          printf '#!/bin/bash\ntouch /tmp/relative-digger-ran\n' > fake-digger-rel/digger
          chmod +x fake-digger-rel/digger
      - id: action
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: ./fake-digger-rel
          configure-checkout: "false"
      - name: Assert action failed without running binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for relative local-dev-cli-path"
            exit 1
          fi
          if [ -f /tmp/relative-digger-ran ]; then
            echo "FAIL: digger binary should not have been executed"
            exit 1
          fi
          echo "PASS"
