name: Test Google credentials inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run digger with Google credential inputs (setup-google-cloud disabled)
        id: action
        uses: .
        with:
          configure-checkout: "false"
          no-backend: "true"
          setup-google-cloud: "false"
          google-auth-credentials: '{"type":"service_account","project_id":"example"}'
          google-lock-bucket: "my-lock-bucket"
        continue-on-error: true

      - name: Assert action ran with Google credential inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # setup-google-cloud is false so Google auth is not performed,
          # but the inputs are passed through. The action may succeed or fail
          # depending on digger.yml availability, but should not fail at input validation.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with Google credential inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
