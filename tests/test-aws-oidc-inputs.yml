name: Test AWS OIDC inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-aws: "false"
          aws-role-to-assume: "arn:aws:iam::123456789012:role/TestRole"
          aws-web-identity-token-file: "/tmp/web-identity-token"
          aws-region: "us-east-1"
          digger-version: "v0.6.147"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action was invoked
        run: |
          echo "Action step completed (continue-on-error allows download failures)"
          echo "PASS: aws-role-to-assume and aws-web-identity-token-file inputs were accepted"
