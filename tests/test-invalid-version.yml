name: Test invalid digger-version format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid digger-version
        id: action
        uses: .
        with:
          digger-version: "not-a-valid-version"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed due to invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid digger-version"
