name: Test invalid digger-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Providing an invalid digger-version (not matching vX.Y.Z) should cause
      # the action to fail at the "Determine binary mode" step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "invalid-version"
          configure-checkout: "false"

      - name: Assert action failed due to invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid digger-version format"
