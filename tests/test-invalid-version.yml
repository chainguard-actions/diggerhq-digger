name: Test invalid digger-version input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with an invalid digger-version (not matching vX.Y.Z).
      # The action's determine-binary-mode step should fail with an error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          digger-version: "not-a-valid-version"
          log-level: "DEBUG"

      - name: Assert action failed due to invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid digger-version"

      # Also test that a version without 'v' prefix is invalid
      - name: Attempt determine binary mode with version missing v prefix
        id: missing-v-prefix
        continue-on-error: true
        env:
          LOCAL_DEV_MODE: "false"
          INPUT_DIGGER_VERSION: "0.6.154"
          ACTION_REF: "main"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi
          echo "binary-mode=${BINARY_MODE}" >> ${GITHUB_OUTPUT}
        shell: bash

      - name: Assert version without v prefix caused failure
        env:
          OUTCOME: ${{ steps.missing-v-prefix.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail for version without v prefix but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: version without v prefix correctly caused step failure"
