name: Test Digger config inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          digger-filename: "digger.yml"
          digger-organisation: "my-org"
          digger-private-key: "fake-private-key"
          digger-token: "fake-digger-token"
          digger-version: "v0.6.151"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action ran (expected to fail gracefully without real digger backend)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with digger config inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
