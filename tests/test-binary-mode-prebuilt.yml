name: Test binary mode determination - prebuilt
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the determine-binary-mode step correctly identifies prebuilt mode
      # when a valid vX.Y.Z digger-version is provided.
      # The action will fail later when trying to download/run digger (no real backend),
      # but we verify the binary-mode output is set correctly before that.
      - name: Verify binary mode logic for prebuilt
        env:
          INPUT_DIGGER_VERSION: "v0.6.145"
          LOCAL_DEV_MODE: "false"
          ACTION_REF: "v0.6.145"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi

          echo "binary-mode: $BINARY_MODE"
          if [ "$BINARY_MODE" != "prebuilt" ]; then
            echo "FAIL: expected binary-mode=prebuilt, got $BINARY_MODE"
            exit 1
          fi
          echo "PASS: binary-mode correctly determined as prebuilt"
