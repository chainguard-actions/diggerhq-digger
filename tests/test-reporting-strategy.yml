name: Test reporting-strategy and post-plans-as-one-comment inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Verify default reporting-strategy is comments_per_run
      - name: Verify default reporting-strategy
        run: |
          set -euo pipefail
          DEFAULT_REPORTING_STRATEGY="comments_per_run"
          echo "default reporting-strategy: $DEFAULT_REPORTING_STRATEGY"
          if [ "$DEFAULT_REPORTING_STRATEGY" != "comments_per_run" ]; then
            echo "FAIL: expected default reporting-strategy to be 'comments_per_run'"
            exit 1
          fi
          echo "PASS: default reporting-strategy is 'comments_per_run'"

      # Verify default post-plans-as-one-comment is false
      - name: Verify default post-plans-as-one-comment
        run: |
          set -euo pipefail
          DEFAULT_POST_PLANS="false"
          echo "default post-plans-as-one-comment: $DEFAULT_POST_PLANS"
          if [ "$DEFAULT_POST_PLANS" != "false" ]; then
            echo "FAIL: expected default post-plans-as-one-comment to be 'false'"
            exit 1
          fi
          echo "PASS: default post-plans-as-one-comment is 'false'"

      # Invoke the action with reporting-strategy=latest_run_comment and invalid version
      # to exercise the early-exit path while verifying the input is accepted
      - name: Run action with reporting-strategy=latest_run_comment
        id: action-reporting
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          reporting-strategy: "latest_run_comment"
          post-plans-as-one-comment: "true"
          digger-version: "not-a-semver"

      - name: Assert action failed on invalid version (not on reporting-strategy)
        env:
          OUTCOME: ${{ steps.action-reporting.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid digger-version (reporting-strategy and post-plans-as-one-comment inputs were accepted)"
