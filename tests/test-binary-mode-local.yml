name: Test binary mode - local dev
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with local-dev-mode=true. The action will fail at the
      # local dev step (no compiled digger binary at the path), but we verify it ran.
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          local-dev-mode: "true"
          local-dev-cli-path: "/tmp/fake-digger-dir"
          log-level: "DEBUG"

      - name: Assert action ran (local-dev-mode path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # local-dev-mode=true: action tries to run a local binary that doesn't exist
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no local binary in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Verify the binary-mode determination logic independently
      - name: Verify binary-mode=local logic
        id: determine-binary-mode
        env:
          LOCAL_DEV_MODE: "true"
          INPUT_DIGGER_VERSION: ""
          ACTION_REF: "main"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi
          echo "binary-mode=${BINARY_MODE}" >> ${GITHUB_OUTPUT}
        shell: bash

      - name: Assert binary-mode is local
        env:
          ACTUAL: ${{ steps.determine-binary-mode.outputs.binary-mode }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "local" ]; then
            echo "FAIL: expected 'local' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: binary-mode is 'local' as expected"
