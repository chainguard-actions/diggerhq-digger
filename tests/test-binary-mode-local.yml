name: Test binary mode determination - local dev mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that local-dev-mode=true results in binary-mode=local
      # We verify the logic inline since running the full action in local mode
      # requires a pre-compiled digger binary on the runner.
      - name: Verify binary mode logic for local dev mode
        env:
          INPUT_DIGGER_VERSION: ""
          LOCAL_DEV_MODE: "true"
          ACTION_REF: "main"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi

          echo "binary-mode: $BINARY_MODE"
          if [ "$BINARY_MODE" != "local" ]; then
            echo "FAIL: expected binary-mode=local, got $BINARY_MODE"
            exit 1
          fi
          echo "PASS: binary-mode correctly determined as local"

      # Test that binary-mode=build is selected when no version and action_ref is not a tag
      - name: Verify binary mode logic for build mode
        env:
          INPUT_DIGGER_VERSION: ""
          LOCAL_DEV_MODE: "false"
          ACTION_REF: "main"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi

          echo "binary-mode: $BINARY_MODE"
          if [ "$BINARY_MODE" != "build" ]; then
            echo "FAIL: expected binary-mode=build, got $BINARY_MODE"
            exit 1
          fi
          echo "PASS: binary-mode correctly determined as build"
