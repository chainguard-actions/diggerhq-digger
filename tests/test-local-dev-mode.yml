name: Test local-dev-mode input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with local-dev-mode true and invalid path (relative path)
        id: action-relative
        uses: .
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "./digger"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed due to relative path not allowed
        run: |
          echo "outcome: ${{ steps.action-relative.outcome }}"
          if [ "${{ steps.action-relative.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with relative local-dev-cli-path, but got: ${{ steps.action-relative.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly rejected relative local-dev-cli-path"
