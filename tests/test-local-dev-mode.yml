name: Test local-dev-mode binary selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When local-dev-mode=true the action selects "local" binary mode and
      # tries to run a binary at local-dev-cli-path. We point it at a
      # non-existent path so the action fails at the execution step (not at
      # the version-format validation step), confirming the mode selection
      # logic ran correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "/nonexistent/path/to/digger"
          configure-checkout: "false"
          no-backend: "true"

      - name: Assert action failed at local binary execution (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the local binary doesn't exist,
          # not because of version format validation. Either way, outcome
          # should be "failure" (the binary path is invalid).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when local binary path is invalid, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted local binary mode and failed at execution"
