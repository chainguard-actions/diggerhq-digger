name: Test local-dev-mode binary path validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in local-dev-mode with non-existent binary (should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "/nonexistent/path/to/digger"
          configure-checkout: "false"

      - name: Assert action failed due to missing local binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the local binary path doesn't exist
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing local binary, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when local-dev-mode binary is not found"
