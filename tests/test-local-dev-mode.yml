name: Test local dev mode with invalid path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run digger in local dev mode with invalid path
        id: action
        uses: .
        with:
          local-dev-mode: "true"
          local-dev-cli-path: "/nonexistent/path/to/digger"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed gracefully with invalid local path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when local-dev-cli-path does not exist"
          else
            echo "FAIL: expected action to fail with non-existent local-dev-cli-path, got: $OUTCOME"
            exit 1
          fi
