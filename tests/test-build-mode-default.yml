name: Test default build-from-source mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no version specified (default build mode)
        id: action
        uses: .
        continue-on-error: true
        with:
          # No digger-version set, action_ref under act is not a tag,
          # so binary-mode should be 'build' (compile from source).
          configure-checkout: "false"
          no-backend: "true"
          log-level: "DEBUG"

      - name: Assert action attempted to run in build mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, github.action_ref is not a tag (not v*) and no digger-version
          # is set, so the action takes the 'build' path (compile from source).
          # The build may fail if Go source is not present, but the action must
          # have started (not been skipped or errored before the binary-mode step).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in build mode (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
