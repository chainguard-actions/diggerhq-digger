name: Test prebuilt binary mode with specific version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with specific digger-version (prebuilt mode)
        id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "v0.6.100"
          digger-os: "Linux"
          digger-arch: "X64"
          configure-checkout: "false"
          no-backend: "true"

      - name: Assert action ran (download succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either:
          # - succeed (unlikely without real event context)
          # - fail gracefully (digger exits non-zero due to no valid event)
          # It should NOT be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran (outcome: $OUTCOME) — prebuilt mode was triggered"
