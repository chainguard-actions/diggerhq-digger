name: Test prebuilt binary mode download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run digger in prebuilt mode with specific version
        id: action
        uses: .
        with:
          digger-version: "v0.6.149"
          configure-checkout: "false"
          no-backend: "true"
        continue-on-error: true

      - name: Assert action ran in prebuilt mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (unlikely without digger.yml) or fail
          # gracefully after downloading the binary. The key is it should NOT fail
          # at the version validation step (which would be a different kind of failure).
          # Any outcome (success or failure) is acceptable here as long as it ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in prebuilt mode (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
