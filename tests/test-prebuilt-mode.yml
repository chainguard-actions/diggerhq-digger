name: Test prebuilt binary mode with valid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid prebuilt version
        id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "v0.6.152"
          configure-checkout: "false"
          no-backend: "true"
          log-level: "DEBUG"

      - name: Assert action ran (prebuilt mode - digger binary downloaded and executed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (e.g. no digger.yml found).
          # It must NOT fail due to version validation (that would be a bug).
          # Both success and failure are acceptable here since there is no digger.yml
          # in the test workspace, but the binary download path must have been taken.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in prebuilt mode (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
