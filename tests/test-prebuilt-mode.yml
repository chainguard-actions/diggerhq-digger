name: Test prebuilt binary mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action will try to download and run digger, which may fail in the harness
      # (sentinel repo, no real PR/issue context). We assert on the outcome gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "v0.6.153"
          configure-checkout: "false"
          no-backend: "false"
          log-level: "INFO"

      - name: Assert action ran (prebuilt mode - download attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In prebuilt mode, digger is downloaded and run. Under the harness
          # there is no real GitHub event context so digger exits non-zero.
          # We accept either success or failure — what matters is the action
          # reached the download/run step (not an input-validation error).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action reached execution phase (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
