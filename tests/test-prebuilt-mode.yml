name: Test prebuilt binary mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          digger-version: "v0.6.151"
          configure-checkout: "false"
          no-backend: "true"
      - name: Assert action ran in prebuilt mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In prebuilt mode the action downloads the digger binary and runs it.
          # Without a digger.yml config the CLI exits non-zero, so the step may
          # fail. Either success (unlikely without config) or failure (expected
          # without digger.yml) is acceptable — what matters is that the action
          # did NOT fail at the version-validation or download step with an
          # unexpected error. A "skipped" outcome would indicate a logic bug.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in prebuilt mode (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
