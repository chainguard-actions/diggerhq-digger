name: Test cache directory setup logic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with configure-checkout=false. The action sets up
      # TF_PLUGIN_CACHE_DIR and creates the cache directory. It will fail at
      # the build/run step but the cache dir setup is exercised.
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          no-backend: "true"
          log-level: "DEBUG"

      - name: Assert action ran (cache dir setup exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Test default cache dir (empty terraform-cache-dir → workspace/cache)
      - name: Test default cache dir setup
        id: default-cache-dir
        run: |
          # Replicate the action's "retrieve cache dir" step logic
          TERRAFORM_CACHE_DIR=""
          if [ -z "$TERRAFORM_CACHE_DIR" ]; then
            CACHE_DIR="${GITHUB_WORKSPACE}/cache"
          else
            CACHE_DIR="$TERRAFORM_CACHE_DIR"
          fi
          echo "cache-dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
          echo "Cache dir set to: $CACHE_DIR"
        shell: bash

      - name: Assert default cache dir is workspace/cache
        env:
          ACTUAL: ${{ steps.default-cache-dir.outputs.cache-dir }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="${WORKSPACE}/cache"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: default cache dir is workspace/cache"

      # Test custom cache dir
      - name: Test custom cache dir setup
        id: custom-cache-dir
        run: |
          TERRAFORM_CACHE_DIR="/custom/cache/path"
          if [ -z "$TERRAFORM_CACHE_DIR" ]; then
            CACHE_DIR="${GITHUB_WORKSPACE}/cache"
          else
            CACHE_DIR="$TERRAFORM_CACHE_DIR"
          fi
          echo "cache-dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
          echo "Cache dir set to: $CACHE_DIR"
        shell: bash

      - name: Assert custom cache dir is used
        env:
          ACTUAL: ${{ steps.custom-cache-dir.outputs.cache-dir }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="/custom/cache/path"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: custom cache dir is used correctly"

      # Test that the cache directory can be created
      - name: Test cache dir creation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cache"
          if [ ! -d "$GITHUB_WORKSPACE/cache" ]; then
            echo "FAIL: cache directory was not created"
            exit 1
          fi
          echo "PASS: cache directory created successfully"
        shell: bash
