name: Test input coverage (credentials and upload destinations)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises all previously-uncovered optional inputs.
      # The action will attempt to download/run digger (prebuilt mode via digger-version),
      # which will fail in the harness environment — that is expected and acceptable.
      # The purpose of this test is input coverage: every input must appear in a with: block.
      - id: action
        uses: .
        continue-on-error: true
        with:
          # AWS inputs
          aws-access-key-id: fake-aws-key-id
          aws-secret-access-key: fake-aws-secret
          aws-role-to-assume: arn:aws:iam::123456789012:role/fake-role
          aws-web-identity-token-file: /tmp/fake-web-identity-token
          # Azure inputs
          azure-client-id: fake-azure-client-id
          azure-tenant-id: fake-azure-tenant-id
          azure-subscription-id: fake-azure-subscription-id
          # Google Cloud inputs
          google-auth-credentials: '{"type":"service_account","project_id":"fake"}'
          google-workload-identity-provider: projects/123/locations/global/workloadIdentityPools/fake/providers/fake
          google-workload-identity-provider-audience: https://iam.googleapis.com/fake
          google-service-account: fake@fake-project.iam.gserviceaccount.com
          google-lock-bucket: fake-lock-bucket
          # Upload plan destination inputs
          upload-plan-destination: aws
          upload-plan-destination-s3-bucket: fake-plan-bucket
          upload-plan-destination-s3-encryption-kms-key-id: fake-kms-key-id
          upload-plan-destination-azure-container: fake-azure-container
          upload-plan-destination-azure-storage-account: fake-azure-storage-account
          upload-plan-destination-gcp-bucket: fake-gcp-bucket
          # Digger auth inputs
          digger-token: fake-digger-token
          digger-private-key: fake-digger-private-key
          digger-organisation: fake-org
          digger-filename: digger.yml
          # Use a specific version to trigger prebuilt mode (avoids building from source)
          digger-version: v0.6.0
          # Disable cloud setups so we don't actually try to authenticate
          setup-aws: "false"
          setup-google-cloud: "false"
          setup-azure: "false"
          configure-checkout: "false"

      - name: Assert action ran (download may fail in harness — that is acceptable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness — digger download/run fails)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
