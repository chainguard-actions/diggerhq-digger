name: Test Google Cloud inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          setup-google-cloud: "false"
          google-auth-credentials: '{"type":"service_account","project_id":"fake-project"}'
          google-workload-identity-provider: "projects/123456789/locations/global/workloadIdentityPools/fake-pool/providers/fake-provider"
          google-workload-identity-provider-audience: "https://iam.googleapis.com/fake-audience"
          google-service-account: "fake-sa@fake-project.iam.gserviceaccount.com"
          google-lock-bucket: "my-lock-bucket"
          configure-checkout: "false"
          digger-version: "v0.6.146"
          no-backend: "true"
      - name: Assert inputs were accepted
        run: |
          echo "Action step completed (continue-on-error). Inputs were passed successfully."
          echo "PASS: Google Cloud inputs were accepted by the action"
