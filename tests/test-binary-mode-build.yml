name: Test binary mode build when no version specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Verify the binary mode determination logic sets 'build' when no version
      # is provided and local-dev-mode is false and action_ref doesn't start with 'v'
      - name: Verify binary mode determination for build
        env:
          LOCAL_DEV_MODE: "false"
          INPUT_DIGGER_VERSION: ""
          ACTION_REF: "refs/heads/act-harness"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi

          echo "binary-mode: $BINARY_MODE"
          if [ "$BINARY_MODE" != "build" ]; then
            echo "FAIL: expected binary-mode=build but got $BINARY_MODE"
            exit 1
          fi
          echo "PASS: binary-mode correctly set to build"

      # Verify that a valid version string passes validation
      - name: Verify valid version format passes validation
        run: |
          set -euo pipefail
          for VERSION in "v1.0.0" "v0.6.147" "v10.20.300" ""; do
            if [[ ! ( -z "$VERSION" || "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
              echo "FAIL: version '$VERSION' should be valid but failed validation"
              exit 1
            fi
            echo "PASS: version '$VERSION' correctly passes validation"
          done

      # Verify that invalid version strings fail validation
      - name: Verify invalid version formats fail validation
        run: |
          set -euo pipefail
          for VERSION in "1.0.0" "v1.0" "latest" "main" "not-a-version" "v1.0.0-beta"; do
            if [[ ! ( -z "$VERSION" || "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
              echo "PASS: version '$VERSION' correctly fails validation"
            else
              echo "FAIL: version '$VERSION' should fail validation but passed"
              exit 1
            fi
          done

      # Call the action with an invalid version to exercise the validation path.
      # The action should fail at the determine-binary-mode step before any
      # network calls or Go builds are attempted.
      - id: action
        uses: .
        with:
          digger-version: "not-a-valid-version"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed at version validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version"
            exit 1
          fi
          echo "PASS: action correctly failed at version validation step"
