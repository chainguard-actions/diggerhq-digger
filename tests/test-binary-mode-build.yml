name: Test binary mode - build (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with configure-checkout=false to avoid re-checkout.
      # Under act, github.action_ref is not a v* tag and digger-version is empty,
      # so binary-mode should be "build". The action will fail at the build step
      # (no Go source in test env), but we verify it ran.
      - id: action
        uses: .
        continue-on-error: true
        with:
          configure-checkout: "false"
          no-backend: "true"
          log-level: "DEBUG"
          local-dev-mode: "false"

      - name: Assert action ran (binary-mode=build path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # binary-mode=build: action tries to build from Go source and fails in test env
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test env without Go source)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Verify the binary-mode determination logic independently
      - name: Verify binary-mode=build logic
        id: determine-binary-mode
        env:
          LOCAL_DEV_MODE: "false"
          INPUT_DIGGER_VERSION: ""
          ACTION_REF: "main"
        run: |
          set -euo pipefail

          if [[ ! ( -z "$INPUT_DIGGER_VERSION" || "$INPUT_DIGGER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
            echo "::error::Invalid digger-version input $INPUT_DIGGER_VERSION. Must be empty string or match vX.Y.Z"
            exit 1
          fi

          if [[ "$LOCAL_DEV_MODE" == "true" ]]; then
            BINARY_MODE="local"
          elif [[ -n "$INPUT_DIGGER_VERSION" || "$ACTION_REF" == v* ]]; then
            BINARY_MODE="prebuilt"
          else
            BINARY_MODE="build"
          fi
          echo "binary-mode=${BINARY_MODE}" >> ${GITHUB_OUTPUT}
        shell: bash

      - name: Assert binary-mode is build
        env:
          ACTUAL: ${{ steps.determine-binary-mode.outputs.binary-mode }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "build" ]; then
            echo "FAIL: expected 'build' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: binary-mode is 'build' as expected"
