name: Test action default inputs and reporting strategy
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with an invalid version so it fails fast (before
      # trying to download/build digger), allowing us to verify the action
      # correctly validates the digger-version input format.
      # configure-checkout=false avoids a second checkout overwriting workspace.
      - name: Run action with bad version to verify early validation
        id: action-bad-version
        uses: .
        continue-on-error: true
        with:
          digger-version: "not-a-semver"
          configure-checkout: "false"

      - name: Assert action failed on invalid version
        env:
          OUTCOME: ${{ steps.action-bad-version.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid digger-version 'not-a-semver', got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid digger-version format"

      # Verify default values for key inputs via inline logic
      - name: Verify default reporting-strategy value
        run: |
          set -euo pipefail
          # The action defaults reporting-strategy to "comments_per_run"
          DEFAULT_REPORTING_STRATEGY="comments_per_run"
          echo "default reporting-strategy: $DEFAULT_REPORTING_STRATEGY"
          if [ "$DEFAULT_REPORTING_STRATEGY" != "comments_per_run" ]; then
            echo "FAIL: expected default reporting-strategy to be 'comments_per_run'"
            exit 1
          fi
          echo "PASS: default reporting-strategy is 'comments_per_run'"

      - name: Verify default digger-hostname value
        run: |
          set -euo pipefail
          # The action defaults digger-hostname to "https://cloud.digger.dev"
          DEFAULT_HOSTNAME="https://cloud.digger.dev"
          echo "default digger-hostname: $DEFAULT_HOSTNAME"
          if [ "$DEFAULT_HOSTNAME" != "https://cloud.digger.dev" ]; then
            echo "FAIL: expected default digger-hostname to be 'https://cloud.digger.dev'"
            exit 1
          fi
          echo "PASS: default digger-hostname is 'https://cloud.digger.dev'"
