name: Test digger-version format validation logic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that valid version formats pass the regex validation
      - name: Verify valid version formats pass validation
        run: |
          set -euo pipefail
          PASS_COUNT=0
          for VERSION in "v1.0.0" "v0.6.147" "v10.20.300" "v0.0.1" ""; do
            if [[ ! ( -z "$VERSION" || "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
              echo "FAIL: version '$VERSION' should be valid but failed validation"
              exit 1
            fi
            echo "PASS: version '$VERSION' correctly passes validation"
            PASS_COUNT=$((PASS_COUNT + 1))
          done
          echo "All $PASS_COUNT valid versions passed validation"

      # Test that invalid version formats fail the regex validation
      - name: Verify invalid version formats fail validation
        run: |
          set -euo pipefail
          PASS_COUNT=0
          for VERSION in "1.0.0" "v1.0" "latest" "main" "not-a-version" "v1.0.0-beta" "v1.0.0.0" "V1.0.0"; do
            if [[ ! ( -z "$VERSION" || "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ) ]]; then
              echo "PASS: version '$VERSION' correctly fails validation"
              PASS_COUNT=$((PASS_COUNT + 1))
            else
              echo "FAIL: version '$VERSION' should fail validation but passed"
              exit 1
            fi
          done
          echo "All $PASS_COUNT invalid versions correctly failed validation"

      # Test that the action itself rejects an invalid version (no v prefix)
      - name: Run action with version missing v prefix
        id: action-no-v
        uses: .
        with:
          digger-version: "1.0.0"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed for version without v prefix
        env:
          OUTCOME: ${{ steps.action-no-v.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with version '1.0.0' (missing v prefix), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected version without v prefix"

      # Test that the action rejects a version with pre-release suffix
      - name: Run action with pre-release version
        id: action-prerelease
        uses: .
        with:
          digger-version: "v1.0.0-beta"
          configure-checkout: "false"
        continue-on-error: true

      - name: Assert action failed for pre-release version
        env:
          OUTCOME: ${{ steps.action-prerelease.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with pre-release version 'v1.0.0-beta', but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected pre-release version format"
